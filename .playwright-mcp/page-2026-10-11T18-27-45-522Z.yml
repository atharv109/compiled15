        - generic [ref=f6e125]: Why it works
        - text: Built for the decision, not the deck.
      - paragraph [ref=f6e126]: The owner types a business name. Nothing else. Scout adapters read every public trace they can reach, and the swarm's personas and segments emerge from that evidence — nothing about a café, a clinic, or a startup is hardcoded. The pipeline is generic; the content is yours.
      - heading "The debate is grounded" [level=3] [ref=f6e127]
      - list [ref=f6e128]:
        - listitem [ref=f6e129]:
          - generic [ref=f6e130]: —
          - generic [ref=f6e131]: Evidence cited from real sources — every persona argues from what the internet actually says
        - listitem [ref=f6e132]:
          - generic [ref=f6e133]: —
          - generic [ref=f6e134]: Camps read each other's strongest points before their second turn
        - listitem [ref=f6e135]:
          - generic [ref=f6e136]: —
          - generic [ref=f6e137]: Fabricated evidence is demoted to neutral, so bluffing can't win a vote
        - listitem [ref=f6e138]:
          - generic [ref=f6e139]: —
          - generic [ref=f6e140]: Borderline tallies become low-confidence verdicts — that's honesty, a feature
      - heading "And the swarm keeps getting better" [level=3] [ref=f6e141]
      - paragraph [ref=f6e142]: Every proposal is tested against a calibrated mock market — seeded truth hidden from the agents, beliefs rewritten by outcomes, keep-if-better. When the loop stops improving a plan, the verdict says so.
      - list [ref=f6e143]:
        - listitem [ref=f6e144]:
          - generic [ref=f6e145]: —
          - generic [ref=f6e146]: Calibration proposes ranges from reviews; truth is sampled inside them
        - listitem [ref=f6e147]:
          - generic [ref=f6e148]: —
          - generic [ref=f6e149]: Train/test splits with shifted contexts — no memorizing one market
        - listitem [ref=f6e150]:
          - generic [ref=f6e151]: —
          - generic [ref=f6e152]: The naive plan ("open till 2 AM + promo everywhere") fails on most seeds
        - listitem [ref=f6e153]:
          - generic [ref=f6e154]: —
          - generic [ref=f6e155]: "In production: owners log real outcomes, and the swarm learns from those"
      - paragraph [ref=f6e156]: Your customers already told the internet.We bring the internet to the decision.
