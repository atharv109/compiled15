        - listitem [ref=f1e147]:
          - generic [ref=f1e148]: —
          - generic [ref=f1e149]: Train/test splits with shifted contexts — no memorizing one market
        - listitem [ref=f1e150]:
          - generic [ref=f1e151]: —
          - generic [ref=f1e152]: The naive plan ("open till 2 AM + promo everywhere") fails on most seeds
        - listitem [ref=f1e153]:
          - generic [ref=f1e154]: —
          - generic [ref=f1e155]: "In production: owners log real outcomes, and the swarm learns from those"
      - paragraph [ref=f1e156]: Your customers already told the internet.We bring the internet to the decision.
