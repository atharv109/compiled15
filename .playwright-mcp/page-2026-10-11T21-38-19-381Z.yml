        - generic [ref=f1e125]: Why it works
        - text: Built for the decision, not the deck.
      - paragraph [ref=f1e126]: The owner types a business name. Nothing else. Scout adapters read every public trace they can reach, and the swarm's personas and segments emerge from that evidence — nothing about a café, a clinic, or a startup is hardcoded. The pipeline is generic; the content is yours.
      - heading "The debate is grounded" [level=3] [ref=f1e127]
      - list [ref=f1e128]:
        - listitem [ref=f1e129]:
          - generic [ref=f1e130]: —
          - generic [ref=f1e131]: Evidence cited from real sources — every persona argues from what the internet actually says
        - listitem [ref=f1e132]:
          - generic [ref=f1e133]: —
          - generic [ref=f1e134]: Camps read each other's strongest points before their second turn
        - listitem [ref=f1e135]:
          - generic [ref=f1e136]: —
          - generic [ref=f1e137]: Fabricated evidence is demoted to neutral, so bluffing can't win a vote
        - listitem [ref=f1e138]:
          - generic [ref=f1e139]: —
          - generic [ref=f1e140]: Borderline tallies become low-confidence verdicts — that's honesty, a feature
      - heading "And the swarm keeps getting better" [level=3] [ref=f1e141]
      - paragraph [ref=f1e142]: Every proposal is tested against a calibrated mock market — seeded truth hidden from the agents, beliefs rewritten by outcomes, keep-if-better. When the loop stops improving a plan, the verdict says so.
      - list [ref=f1e143]:
        - listitem [ref=f1e144]:
          - generic [ref=f1e145]: —
