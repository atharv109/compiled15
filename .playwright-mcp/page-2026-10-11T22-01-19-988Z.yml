    - generic [ref=f10e120]:
      - heading "Why it works Built for the decision, not the deck." [level=2] [ref=f10e121]:
        - generic [ref=f10e122]: Why it works
        - text: Built for the decision, not the deck.
      - paragraph [ref=f10e123]: The owner types a business name. Nothing else. Scout adapters read every public trace they can reach, and the swarm's personas and segments emerge from that evidence — nothing about a café, a clinic, or a startup is hardcoded. The pipeline is generic; the content is yours.
      - heading "The debate is grounded" [level=3] [ref=f10e124]
      - list [ref=f10e125]:
        - listitem [ref=f10e126]:
          - generic [ref=f10e127]: —
          - generic [ref=f10e128]: Evidence cited from real sources — every persona argues from what the internet actually says
        - listitem [ref=f10e129]:
          - generic [ref=f10e130]: —
          - generic [ref=f10e131]: Camps read each other's strongest points before their second turn
        - listitem [ref=f10e132]:
          - generic [ref=f10e133]: —
          - generic [ref=f10e134]: Fabricated evidence is demoted to neutral, so bluffing can't win a vote
        - listitem [ref=f10e135]:
          - generic [ref=f10e136]: —
          - generic [ref=f10e137]: Borderline tallies become low-confidence verdicts — that's honesty, a feature
      - heading "And the swarm keeps getting better" [level=3] [ref=f10e138]
      - paragraph [ref=f10e139]: Every proposal is tested against a calibrated mock market — seeded truth hidden from the agents, beliefs rewritten by outcomes, keep-if-better. When the loop stops improving a plan, the verdict says so.
      - list [ref=f10e140]:
        - listitem [ref=f10e141]:
          - generic [ref=f10e142]: —
          - generic [ref=f10e143]: Calibration proposes ranges from reviews; truth is sampled inside them
        - listitem [ref=f10e144]:
          - generic [ref=f10e145]: —
          - generic [ref=f10e146]: Train/test splits with shifted contexts — no memorizing one market
        - listitem [ref=f10e147]:
          - generic [ref=f10e148]: —
          - generic [ref=f10e149]: The naive plan ("open till 2 AM + promo everywhere") fails on most seeds
        - listitem [ref=f10e150]:
          - generic [ref=f10e151]: —
          - generic [ref=f10e152]: "In production: owners log real outcomes, and the swarm learns from those"
      - paragraph [ref=f10e153]: Your customers already told the internet.We bring the internet to the decision.
