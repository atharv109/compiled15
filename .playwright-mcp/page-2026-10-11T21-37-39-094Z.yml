        - generic [ref=e125]: Why it works
        - text: Built for the decision, not the deck.
      - paragraph [ref=e126]: The owner types a business name. Nothing else. Scout adapters read every public trace they can reach, and the swarm's personas and segments emerge from that evidence — nothing about a café, a clinic, or a startup is hardcoded. The pipeline is generic; the content is yours.
      - heading "The debate is grounded" [level=3] [ref=e127]
      - list [ref=e128]:
