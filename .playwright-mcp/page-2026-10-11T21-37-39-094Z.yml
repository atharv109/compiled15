      - heading "And the swarm keeps getting better" [level=3] [ref=e141]
      - paragraph [ref=e142]: Every proposal is tested against a calibrated mock market — seeded truth hidden from the agents, beliefs rewritten by outcomes, keep-if-better. When the loop stops improving a plan, the verdict says so.
